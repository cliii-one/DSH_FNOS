# =============================================================
# DSH for fnOS - GitHub Actions 自动构建
#
# 全程在 GitHub x64 服务器上构建，NAS 本机零负担
#
# 触发方式：
#   1. push 到 master 自动构建（版本检查兜底，已发布过的版本自动跳过）
#   2. 手动 workflow_dispatch（可指定上游 ref，默认 master）
#   3. 每日定时检查上游是否发新版，有新版本才构建发布
#
# 流程：拉上游源码 -> pnpm 构建 -> pack tgz -> 组装应用壳（运行时用 nodejs_v24 依赖）
#      -> fnpack 打包 -> 上传 artifact + 发 GitHub Release
# =============================================================
name: build

on:
  push:
    branches: [master]
    # 文档类改动不触发构建
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游 deepseek-harness 的分支/标签"
        required: false
        default: "master"
      force_release:
        description: "即使版本无变化也强制发布"
        type: boolean
        required: false
        default: false
  schedule:
    # 每天 UTC 20:00（北京时间次日凌晨 4 点）检查上游更新
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库（应用壳）
        uses: actions/checkout@v4

      - name: Checkout 上游 deepseek-harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ inputs.upstream_ref || 'master' }}
          path: upstream
          fetch-depth: 1

      - name: 读取上游版本号
        id: ver
        run: |
          DSH_VERSION=$(node -p "require('./upstream/package.json').version")
          echo "version=${DSH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "上游版本: ${DSH_VERSION}"

      - name: 查询是否已发布过该版本
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ steps.ver.outputs.version }}
          FORCE: ${{ inputs.force_release || 'false' }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "v${DSH_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "版本 v${DSH_VERSION} 已发布过，跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Node.js 24
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 pnpm
        if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          # 用 pnpm 10：其 onlyBuiltDependencies 白名单行为已在本地实测验证；
          # pnpm 11 对安装脚本审批更严格，白名单写法有差异
          version: 10

      - name: 安装上游依赖并构建
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: |
          pnpm install
          pnpm run build

      - name: pack 上游 dsh 包为 tgz
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: |
          mkdir -p ../tgz
          pnpm --filter @deepseek-ai/dsh pack --pack-destination ../tgz
          echo "DSH_TGZ=${GITHUB_WORKSPACE}/tgz/$(ls ../tgz | head -1)" >> "$GITHUB_ENV"

      - name: 安装 fnpack（飞牛官方打包工具）
        if: steps.check.outputs.skip != 'true'
        run: |
          # 官方静态分发地址（直接是二进制，非 zip）
          # CI 是 amd64，用 fnpack-1.2.3-linux-amd64；NAS 本机打包装 arm64 版
          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          curl -sfL --retry 3 -o /tmp/fnpack "${FNPACK_URL}"
          chmod +x /tmp/fnpack
          sudo mv /tmp/fnpack /usr/local/bin/fnpack
          fnpack --version || true

      - name: 组装 fnOS 应用目录
        if: steps.check.outputs.skip != 'true'
        env:
          DSH_VERSION: ${{ steps.ver.outputs.version }}
          DSH_TGZ: ${{ env.DSH_TGZ }}
        run: |
          set -x
          pnpm --version
          STAGE_DIR="${GITHUB_WORKSPACE}/stage" \
          UPSTREAM_DIR="${GITHUB_WORKSPACE}/upstream" \
          DSH_TGZ="${DSH_TGZ}" \
          PNPM_BIN="$(command -v pnpm)" \
            bash scripts/assemble.sh || {
              echo "::group::诊断信息"
              echo "pnpm 版本: $(pnpm --version)"
              ls -la stage/DSH/ 2>/dev/null
              cat stage/DSH/pnpm-workspace.yaml 2>/dev/null
              echo "::endgroup::"
              exit 1
            }

      - name: 调试快照（始终上传，定位用）
        if: always()
        run: |
          # 无论成败，把 stage 目录清单与 pnpm store 状态打包，供远程诊断
          {
            echo "== pnpm 版本 =="; pnpm --version
            echo "== stage/DSH 顶层 =="; ls -la stage/DSH/ 2>/dev/null
            echo "== pnpm-workspace.yaml =="; cat stage/DSH/pnpm-workspace.yaml 2>/dev/null
            echo "== node_modules/.pnpm 数量 =="; ls stage/DSH/node_modules/.pnpm 2>/dev/null | wc -l
            echo "== dsh 本体 =="; ls stage/DSH/node_modules/@deepseek-ai/dsh/lib/bin.js 2>/dev/null
            echo "== .node 产物分布 =="; find stage/DSH -name "*.node" 2>/dev/null | grep -oE '(linux|darwin|win32)-(x64|arm64)[^/]*' | sort | uniq -c
          } > debug-snapshot.txt 2>&1 || true
          cat debug-snapshot.txt

      - name: 校验包体（arm64 原生产物齐全）
        if: steps.check.outputs.skip != 'true'
        run: |
          # 目标平台是 arm64 NAS：必须有 linux-arm64 产物，禁止 linux-x64 产物
          if ! find stage/DSH -name "*.node" -path "*linux-arm64*" | grep -q .; then
            echo "::error::未找到 linux-arm64 原生模块，arm64 NAS 无法运行"
            exit 1
          fi
          if find stage/DSH -name "*.node" -path "*linux-x64*" | grep -q .; then
            echo "::error::包内混入 linux-x64 原生模块（npm_config_arch 未生效？）"
            find stage/DSH -name "*.node" -path "*linux-x64*"
            exit 1
          fi
          echo "✓ 包体校验通过（linux-arm64 产物齐全）"

      - name: fnpack 打包
        if: steps.check.outputs.skip != 'true'
        working-directory: stage/DSH
        run: |
          if ! command -v fnpack >/dev/null 2>&1; then
            echo "::error::fnpack 不可用，请检查下载地址"
            exit 1
          fi
          fnpack build
          FPK=$(ls *.fpk | head -1)
          mv "${FPK}" "${GITHUB_WORKSPACE}/DSH_all.fpk"

      - name: 上传构建产物 artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DSH_all
          path: DSH_all.fpk

      - name: 发布 GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${DSH_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSH v${DSH_VERSION}" \
            --notes "DeepSeek Harness v${DSH_VERSION} 飞牛 fnOS 自动构建版（跨架构）。

          **更新内容见上游**: https://github.com/deepseek-ai/deepseek-harness

          **安装方式**:
          1. 下载下方 \`DSH_all.fpk\`
          2. 飞牛应用中心 → 手动安装 → 上传该文件
          3. 通过飞牛统一网关访问（/app/dsh），需先登录 NAS，无端口冲突
          4. 依赖：应用中心需已安装 nodejs_v24 运行时" \
            "DSH_all.fpk"
