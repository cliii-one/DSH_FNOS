# =============================================================
# DSH for fnOS - GitHub Actions 自动构建
#
# 全程在 GitHub arm64 服务器上构建，NAS 本机零负担
#
# 触发方式：
#   1. push 到 master 自动构建
#   2. 手动 workflow_dispatch（可指定上游 ref，默认 master）
#   3. 每日定时检查上游是否发新版，有新版本才构建发布
#
# 流程：拉上游源码 -> pnpm 构建 -> pack tgz -> 组装应用壳（运行时用 nodejs_v24 依赖）
#      -> fnpack 打包 -> 上传 artifact + 发 GitHub Release
# =============================================================
name: build

on:
  push:
    branches: [master]
    # 文档类改动不触发构建
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游 deepseek-harness 的分支/标签"
        required: false
        default: "master"
      force_release:
        description: "即使版本无变化也强制发布"
        type: boolean
        required: false
        default: false
  schedule:
    # 每天 UTC 20:00（北京时间次日凌晨 4 点）检查上游更新
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  build:
    # 原生 arm64 运行器（公共仓库免费）：
    # 依赖的原生模块（koffi/node-pty 等）直接按 arm64 原生安装，与 NAS 架构一致，
    # 免去 x64 上交叉安装导致的产物架构不匹配
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout 本仓库（应用壳）
        uses: actions/checkout@v4

      - name: Checkout 上游 deepseek-harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ inputs.upstream_ref || 'master' }}
          path: upstream
          fetch-depth: 1

      - name: 读取上游版本号
        id: ver
        run: |
          DSH_VERSION=$(node -p "require('./upstream/package.json').version")
          echo "version=${DSH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "上游版本: ${DSH_VERSION}"

      - name: 查询是否需要构建
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ steps.ver.outputs.version }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force_release || 'false' }}
        run: |
          # 仅定时任务做"版本未变则跳过"检查；
          # push / 手动触发永远构建 —— 应用代码可能变了（如打包修复），
          # 需要重新出包并覆盖更新已有 Release
          if [ "${EVENT}" = "schedule" ] && [ "${FORCE}" != "true" ]; then
            if gh release view "v${DSH_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "定时任务：版本 v${DSH_VERSION} 已发布过，跳过构建"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 安装 Node.js 24
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 pnpm
        if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          # 用 pnpm 11：与上游 packageManager 声明一致，仅用于构建上游 monorepo；
          # 应用壳内的依赖安装由 assemble.sh 用 npm 完成（扁平布局，规避软链问题）
          version: 11

      - name: 安装上游依赖并构建
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: |
          echo "=== [A] pnpm install 上游开始 ==="
          pnpm install
          echo "=== [A] pnpm install 上游完成 ==="
          echo "=== [B] pnpm run build 开始（内存最大 6GB）==="
          NODE_OPTIONS="--max-old-space-size=6144" pnpm run build
          echo "=== [B] pnpm run build 完成 ==="

      - name: pack 上游 dsh 包为 tgz
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: |
          echo "=== [C] pack tgz 开始 ==="
          mkdir -p ../tgz
          pnpm --filter @deepseek-ai/dsh pack --pack-destination ../tgz
          DSH_TGZ="${GITHUB_WORKSPACE}/tgz/$(ls ../tgz | head -1)"
          echo "DSH_TGZ=${DSH_TGZ}" >> "$GITHUB_ENV"
          # 上游偶发引用尚未发布到 npm 的包（新 experimental 包常滞后发布）。
          # npm install 处理 file: tgz 时会解析 tgz 内部的 dependencies，
          # 因此必须在 tgz 内剔除这些包，否则安装必然 E404。
          # 做法：解开 tgz → 从 package.json 剔除 npm 上不存在的依赖 → 重新打包。
          node <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const tgz = process.env.DSH_TGZ;
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'tgz-fix-'));
          execSync(`tar -xzf ${tgz} -C ${tmp} package/package.json`);
          const manifestPath = path.join(tmp, 'package', 'package.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const removed = [];
          for (const field of ['dependencies', 'optionalDependencies']) {
            const deps = manifest[field];
            if (!deps) continue;
            for (const [name] of Object.entries(deps)) {
              if (name.startsWith('file:')) continue;
              try { execSync(`npm view ${name} version`, { stdio: 'ignore' }); }
              catch { removed.push(name); delete deps[name]; }
            }
          }
          if (removed.length > 0) {
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
            execSync(`tar -czf ${tgz} -C ${tmp} package`);
            console.log('已从 tgz 剔除 npm 上不存在的依赖:', removed.join(', '));
          } else {
            console.log('tgz 依赖全部可用，无需剔除');
          }
          fs.rmSync(tmp, { recursive: true, force: true });
          EOF
          echo "=== [C] pack tgz 完成: $(ls -la ../tgz) ==="

      - name: 安装 fnpack（飞牛官方打包工具）
        if: steps.check.outputs.skip != 'true'
        run: |
          # 官方静态分发地址（直接是二进制，非 zip）
          # arm64 运行器，用 arm64 版 fnpack
          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-arm64"
          curl -sfL --retry 3 -o /tmp/fnpack "${FNPACK_URL}"
          chmod +x /tmp/fnpack
          sudo mv /tmp/fnpack /usr/local/bin/fnpack
          fnpack --version || true

      - name: 组装 fnOS 应用目录
        if: steps.check.outputs.skip != 'true'
        env:
          DSH_VERSION: ${{ steps.ver.outputs.version }}
          DSH_TGZ: ${{ env.DSH_TGZ }}
        run: |
          STAGE_DIR="${GITHUB_WORKSPACE}/stage" \
          UPSTREAM_DIR="${GITHUB_WORKSPACE}/upstream" \
          DSH_TGZ="${DSH_TGZ}" \
            bash scripts/assemble.sh

      - name: 调试快照（始终执行，便于远程诊断）
        if: always()
        run: |
          {
            echo "== stage/DSH 顶层 =="; ls -la stage/DSH/ 2>/dev/null
            echo "== app 顶层 =="; ls -la stage/DSH/app/ 2>/dev/null
            echo "== dsh 本体 =="; ls stage/DSH/app/node_modules/@deepseek-ai/dsh/lib/bin.js 2>/dev/null
            echo "== 软链数量 =="; find stage/DSH -type l 2>/dev/null | wc -l
            echo "== .node 产物分布 =="; find stage/DSH -name "*.node" 2>/dev/null | grep -oE '(linux|darwin|win32)-(x64|arm64)[^/]*' | sort | uniq -c
          } > debug-snapshot.txt 2>&1 || true
          cat debug-snapshot.txt

      - name: 校验包体（arm64 原生产物齐全）
        if: steps.check.outputs.skip != 'true'
        run: |
          # arm64 原生运行器上安装，产物应为 linux-arm64；node-pty 自带全平台 prebuilds 放行
          if ! find stage/DSH -name "*.node" -path "*linux-arm64*" | grep -q .; then
            echo "::error::未找到 linux-arm64 原生模块，arm64 NAS 无法运行"
            exit 1
          fi
          # node-pty 包结构自带全平台 prebuilds，放行
          if find stage/DSH -name "*.node" -path "*linux-x64*" | grep -v "node-pty" | grep -q .; then
            echo "::error::包内混入 linux-x64 原生模块（运行器架构不对？）"
            find stage/DSH -name "*.node" -path "*linux-x64*" | grep -v node-pty
            exit 1
          fi
          echo "✓ 包体校验通过（linux-arm64 产物齐全）"

      - name: fnpack 打包
        if: steps.check.outputs.skip != 'true'
        working-directory: stage/DSH
        env:
          DSH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! command -v fnpack >/dev/null 2>&1; then
            echo "::error::fnpack 不可用，请检查下载地址"
            exit 1
          fi
          fnpack build
          FPK=$(ls *.fpk | head -1)
          # 产物名带版本号，如 DSH_v0.1.7-rc.2_all.fpk
          mv "${FPK}" "${GITHUB_WORKSPACE}/DSH_v${DSH_VERSION}_all.fpk"

      - name: 上传构建产物 artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DSH_v${{ steps.ver.outputs.version }}_all
          path: DSH_v${{ steps.ver.outputs.version }}_all.fpk

      - name: 发布 GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Release 说明（幂等：每次构建都重新生成）
          cat > release-notes.md <<'NOTES'
          DeepSeek Harness v${DSH_VERSION} 飞牛 fnOS 自动构建版（arm64 原生构建）。

          **更新内容见上游**: https://github.com/deepseek-ai/deepseek-harness

          **安装/升级方式**:
          1. 下载下方 `DSH_v${DSH_VERSION}_all.fpk`
          2. 飞牛应用中心 → 手动安装 → 上传该文件（已安装则覆盖升级）
          3. 安装向导中确认服务端口（默认 3082）
          4. 依赖：应用中心需已安装 nodejs_v24 运行时

          **访问方式**: 飞牛桌面点 DSH 卡片，或浏览器打开 `http://NAS地址:3082`
          NOTES
          # tag 已存在则更新资产与说明，否则创建
          if gh release view "v${DSH_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${DSH_VERSION} 已存在，更新资产"
            gh release upload "v${DSH_VERSION}" --repo "$GITHUB_REPOSITORY" --clobber "DSH_v${DSH_VERSION}_all.fpk"
            gh release edit "v${DSH_VERSION}" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "v${DSH_VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DSH v${DSH_VERSION}" \
              --notes-file release-notes.md \
              "DSH_v${DSH_VERSION}_all.fpk"
          fi
